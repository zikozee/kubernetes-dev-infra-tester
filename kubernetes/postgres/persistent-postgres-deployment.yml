apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: default
  labels:
    app: postgres-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate # CRITICAL FIX: Stops the old pod entirely before starting a new one
  selector:
    matchLabels:
      app: postgres-deployment
  template:
    metadata:
      labels:
        app: postgres-deployment
    spec:
      containers:
        - name: postgres
          image: postgres:18 # Safe, robust glibc choice for stateful local K8s
          env:
            - name: POSTGRES_PASSWORD
              value: "admin"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-test-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
  labels:
    app: postgres-deployment
spec:
  selector:
    app: postgres-deployment
  ports:
    - name: postgres-service-port
      protocol: TCP
      port: 5432
      targetPort: 5432 # FIX: Explicitly routes traffic to the container's Postgres port
  type: LoadBalancer
