---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      automountServiceAccountToken: false
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:8.2.2
        ports:
        - containerPort: 8081
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: schema-registry
        - name: SCHEMA_REGISTRY_LISTENERS
          value: http://0.0.0.0:8081
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: PLAINTEXT://kafka:9092
        - name: SCHEMA_REGISTRY_HEAP_OPTS
          value: "-Xms128m -Xmx256m"
        - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
          valueFrom:
            configMapKeyRef:
              name: kafka-variant
              key: TOPIC_REPLICATION_FACTOR
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: "/subjects"
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          httpGet:
            path: "/subjects"
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
      enableServiceLinks: false
