---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-common
  namespace: default
data:
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: "/var/lib/kafka/data/logs"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
  KAFKA_NUM_PARTITIONS: '3'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
  KAFKA_LOG_RETENTION_HOURS: '24'
  KAFKA_LOG_RETENTION_BYTES: '134217728'
  KAFKA_LOG_SEGMENT_BYTES: '16777216'
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '3'
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: '3'
  KAFKA_NUM_NETWORK_THREADS: '2'
  KAFKA_NUM_IO_THREADS: '4'
